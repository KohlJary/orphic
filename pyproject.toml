[project]
name = "orphic"
version = "0.1.0"
description = "Cass's studio: songs as text and MIDI, real instruments, a tone lab, Reaper sessions, and her own ears listening back. No music model."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pedalboard", "mido", "numpy", "scipy", "librosa", "soundfile", "pyworld", "setuptools<80", "cmudict", "pystoi", "piper-tts"]

[project.scripts]
orphic = "orphic.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orphic"]

[tool.setuptools.package-data]
orphic = ["jsfx/*"]
